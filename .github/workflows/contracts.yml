name: Contracts Verification & Schema Compliance

on:
  push:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'
  pull_request:
    paths:
      - 'contracts/**'
      - '.github/workflows/contracts.yml'

jobs:
  validate-contracts:
    name: Validate Contracts & Examples
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Validation Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jsonschema pyyaml pytest rfc3339-validator isoduration

      - name: Run JalSetu Contracts Validator
        run: |
          python contracts/validate.py

      - name: Run Pytest Contract Test Suite
        run: |
          pytest contracts/test_contracts.py -v
