openapi: 3.0.3
info:
  title: NeerSync Core REST API
  description: >-
    Authoritative REST API specification for NeerSync - AI/ML Functional Household Tap Connection (FHTC)
    monitoring platform under India's Jal Jeevan Mission (JJM).
  version: 1.0.0
  contact:
    name: NeerSync Platform Engineering Team
    email: dev@neersync.gov.in

servers:
  - url: https://api.neersync.gov.in
    description: Production Cloud Gateway
  - url: http://localhost:8000
    description: Local Development / Test Gateway

paths:
  /api/v1/telemetry/ingest:
    post:
      summary: Ingest Node Telemetry (HTTP Fallback)
      description: Ingests a single telemetry packet from an IoT node or gateway when MQTT is unavailable.
      operationId: ingestTelemetry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelemetryPayload'
      responses:
        '202':
          description: Telemetry accepted for stream processing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '422':
          $ref: '#/components/responses/422ValidationError'

  /api/v1/status/ingest:
    post:
      summary: Ingest Node Heartbeat / Status
      description: Ingests node availability, heartbeat, and diagnostics.
      operationId: ingestStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusPayload'
      responses:
        '200':
          description: Status recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'

  /api/v1/alerts:
    get:
      summary: Query System Alerts
      description: Retrieves active or historical alerts filtered by GP, severity, type, and date range.
      operationId: listAlerts
      parameters:
        - name: lgd_gp_code
          in: query
          required: false
          schema:
            type: string
            pattern: '^[0-9]{4,8}$'
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, acknowledged, resolved]
        - name: severity
          in: query
          required: false
          schema:
            type: string
            enum: [low, medium, high]
      responses:
        '200':
          description: List of matching alert records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertPayload'
    post:
      summary: Create Alert Incident
      description: Emits a new alert event (generated by ML or rule engine).
      operationId: createAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertPayload'
      responses:
        '201':
          description: Alert created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertPayload'

  /api/v1/alerts/{alert_id}:
    patch:
      summary: Acknowledge or Resolve Alert
      operationId: updateAlertStatus
      parameters:
        - name: alert_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [acknowledged, resolved]
                resolution_notes:
                  type: string
      responses:
        '200':
          description: Alert status updated

  /api/v1/feedback:
    post:
      summary: Ingest Citizen Grievance
      description: Submits a citizen feedback report via PWA, QR scan, WhatsApp chatbot, or IVR.
      operationId: submitFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackPayload'
      responses:
        '201':
          description: Grievance registered
          content:
            application/json:
              schema:
                type: object
                properties:
                  feedback_id:
                    type: string
                  status:
                    type: string
                    example: queued_for_verification
    get:
      summary: Query Citizen Grievances
      operationId: listFeedback
      parameters:
        - name: fhtc_id
          in: query
          required: false
          schema:
            type: string
        - name: category
          in: query
          required: false
          schema:
            type: string
            enum: [no_water, low_pressure, dirty_water, leakage, other]
      responses:
        '200':
          description: Matching grievances list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FeedbackPayload'

  /api/v1/master/gps/{lgd_gp_code}:
    get:
      summary: Get Gram Panchayat Master Data
      operationId: getGPMaster
      parameters:
        - name: lgd_gp_code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: GP metadata and associated schemes
          content:
            application/json:
              schema:
                type: object
                required: [lgd_gp_code, name, district, state]
                properties:
                  lgd_gp_code:
                    type: string
                    example: '245123'
                  name:
                    type: string
                    example: Badepur
                  district:
                    type: string
                    example: Meerut
                  state:
                    type: string
                    example: UP
                  total_fhtc:
                    type: integer
                    example: 450

  /api/v1/master/schemes/{scheme_id}:
    get:
      summary: Get Water Supply Scheme Master Data
      operationId: getSchemeMaster
      parameters:
        - name: scheme_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Scheme metadata

  /api/v1/master/nodes/{node_id}:
    get:
      summary: Get IoT Node Details
      operationId: getNodeDetails
      parameters:
        - name: node_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Node configuration and sensor calibrations

  /api/v1/master/fhtcs/{fhtc_id}:
    get:
      summary: Get Household FHTC Details
      operationId: getFHTCDetails
      parameters:
        - name: fhtc_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: FHTC metadata and connection history

  /api/v1/analytics/predict/supply:
    get:
      summary: Predict Water Supply Availability & Supply Schedule
      description: Returns ML-predicted supply duration, pressure expectation, and service delivery confidence.
      operationId: predictSupply
      parameters:
        - name: lgd_gp_code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: ML prediction result

  /api/v1/analytics/anomalies:
    get:
      summary: Get Detected Pipeline & Quality Anomalies
      description: Anomaly detection outputs for burst leaks, illegal bypasses, or chronic non-functional connections.
      operationId: getAnomalies
      parameters:
        - name: lgd_gp_code
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Anomaly detection telemetry insights

  /api/v1/sync/imis:
    post:
      summary: Push Aggregated Data to National JJM IMIS
      description: >-
        [UNVERIFIED / CONFIGURABLE] Government IMIS push endpoint.
        This endpoint is implemented as a mock sync adapter pending official API access credentials,
        OAuth client credentials, and sandbox documentation from the Department of Drinking Water
        and Sanitation (DDWS). Target endpoint URL, API keys, and retry schedules are configurable
        via environment variables.
      operationId: syncIMIS
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reporting_date, lgd_gp_code, functional_fhtc_count, total_supply_liters]
              properties:
                reporting_date:
                  type: string
                  format: date
                lgd_gp_code:
                  type: string
                functional_fhtc_count:
                  type: integer
                total_supply_liters:
                  type: number
      responses:
        '200':
          description: Mock sync accepted and queued for batch push
          content:
            application/json:
              schema:
                type: object
                properties:
                  sync_status:
                    type: string
                    example: MOCK_SYNC_QUEUED
                  adapter_mode:
                    type: string
                    example: UNVERIFIED_MOCK

  /api/v1/sync/sujal-gaon:
    post:
      summary: Push Village Status to Sujal Gaon
      description: >-
        [UNVERIFIED / CONFIGURABLE] Government Sujal Gaon sync adapter.
        Mock adapter for Har Ghar Jal village certification and daily supply status synchronization.
        Requires official ministerial gateway onboarding.
      operationId: syncSujalGaon
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lgd_gp_code, certified_status, evaluation_ts]
              properties:
                lgd_gp_code:
                  type: string
                certified_status:
                  type: string
                  enum: [CERTIFIED, AT_RISK, NON_FUNCTIONAL]
                evaluation_ts:
                  type: string
                  format: date-time
      responses:
        '200':
          description: Sujal Gaon sync response

components:
  schemas:
    TelemetryPayload:
      type: object
      required:
        - schema_version
        - node_id
        - lgd_gp_code
        - scheme_id
        - ts
        - seq
        - type
        - values
        - battery_v
        - rssi_dbm
        - fw
      properties:
        schema_version:
          type: string
          example: '1.0'
        node_id:
          type: string
          example: NS-UP-245123-N001
        lgd_gp_code:
          type: string
          example: '245123'
        scheme_id:
          type: string
          example: SCH-UP-245123
        ts:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        seq:
          type: integer
          example: 104
        type:
          type: string
          enum: [pump, esr_level, flow, pressure, quality]
          example: pressure
        values:
          type: object
          description: Metrics dictionary matching telemetry.schema.json
          example:
            pressure_kpa: 142.5
        battery_v:
          type: number
          example: 3.85
        rssi_dbm:
          type: integer
          example: -75
        fw:
          type: string
          example: 1.0.0

    StatusPayload:
      type: object
      required:
        - node_id
        - lgd_gp_code
        - scheme_id
        - status
        - uptime_s
        - battery_v
        - rssi_dbm
        - fw
        - last_seen_ts
      properties:
        node_id:
          type: string
          example: NS-UP-245123-N001
        lgd_gp_code:
          type: string
          example: '245123'
        scheme_id:
          type: string
          example: SCH-UP-245123
        status:
          type: string
          enum: [online, offline, degraded]
          example: online
        uptime_s:
          type: integer
          example: 86400
        battery_v:
          type: number
          example: 3.90
        rssi_dbm:
          type: integer
          example: -65
        fw:
          type: string
          example: 1.0.0
        last_seen_ts:
          type: string
          format: date-time
          example: '2026-10-04T12:00:00Z'
        reason:
          type: string
          example: PERIODIC_HEARTBEAT

    AlertPayload:
      type: object
      required:
        - alert_id
        - type
        - severity
        - scope
        - reason
        - created_ts
        - status
      properties:
        alert_id:
          type: string
          example: ALT-20261004-001
        type:
          type: string
          enum: [no_supply, low_pressure, leakage, quality, node_offline, chronic_nonfunctional]
          example: low_pressure
        severity:
          type: string
          enum: [low, medium, high]
          example: high
        scope:
          type: object
          required: [gp, branch]
          properties:
            gp:
              type: string
              example: '245123'
            branch:
              type: string
              example: Branch_South_Ward3
            fhtc_id:
              type: string
              example: FHTC-UP-245123-0042
        reason:
          type: string
          example: Tail-end pressure dropped below 70 kPa for 3 consecutive hours
        created_ts:
          type: string
          format: date-time
          example: '2026-10-04T12:30:00Z'
        status:
          type: string
          enum: [active, acknowledged, resolved]
          example: active

    FeedbackPayload:
      type: object
      required:
        - feedback_id
        - fhtc_id
        - channel
        - category
        - lang
        - ts
      properties:
        feedback_id:
          type: string
          example: FB-20261004-0012
        fhtc_id:
          type: string
          example: FHTC-UP-245123-0042
        channel:
          type: string
          enum: [app, qr, whatsapp, ivr]
          example: whatsapp
        category:
          type: string
          enum: [no_water, low_pressure, dirty_water, leakage, other]
          example: no_water
        text:
          type: string
          example: पानी नहीं आ रहा है दो दिन से (No water supply for 2 days)
        photo_url:
          type: string
          example: https://storage.neersync.gov.in/evidence/fb-0012.jpg
        lat:
          type: number
          example: 28.9845
        lon:
          type: number
          example: 77.7064
        lang:
          type: string
          example: hi
        ts:
          type: string
          format: date-time
          example: '2026-10-04T12:45:00Z'

    IngestResponse:
      type: object
      required: [status, received_ts]
      properties:
        status:
          type: string
          example: accepted
        received_ts:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          example: BAD_REQUEST
        message:
          type: string
          example: Invalid contract schema payload

  responses:
    400BadRequest:
      description: Bad Request - Missing required parameters or malformed JSON
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    422ValidationError:
      description: Validation Error - Payload does not conform to NeerSync schema contract
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
