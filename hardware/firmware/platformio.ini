; ==============================================================================
; NeerSync IoT Edge Node Family - PlatformIO Project Configuration
; Standard: Jal Jeevan Mission (JJM) FHTC Monitoring Architecture
; Pinned dependency versions for production reproducibility
; ==============================================================================

[platformio]
default_envs = esp32_n1_pump
src_dir = src
include_dir = include

[common]
platform = espressif32 @ 6.5.0
framework = arduino
board = esp32dev
monitor_speed = 115200
upload_speed = 921600
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINOJSON_USE_LONG_LONG=1
    -D TINY_GSM_MODEM_SIM7600
lib_deps = 
    bblanchon/ArduinoJson @ 7.0.4
    vshymanskyy/TinyGSM @ 0.11.7
    knolleary/PubSubClient @ 2.8
    jgromes/RadioLib @ 6.5.0
    mandulaj/PZEM-004T-v30 @ 1.1.2

; ------------------------------------------------------------------------------
; Environment: Node N1 - Tube-well / Pump Station Node
; ------------------------------------------------------------------------------
[env:esp32_n1_pump]
extends = common
build_flags = 
    ${common.build_flags}
    -D NODE_TYPE_PUMP=1
    -D NODE_ID_DEFAULT=\"NS-UP-245123-N001\"
    -D SCHEME_ID_DEFAULT=\"SCH-UP-245123\"
    -D LGD_GP_CODE_DEFAULT=\"245123\"

; ------------------------------------------------------------------------------
; Environment: Node N2 - Elevated Storage Reservoir (ESR) Level & Flow Node
; ------------------------------------------------------------------------------
[env:esp32_n2_esr]
extends = common
build_flags = 
    ${common.build_flags}
    -D NODE_TYPE_ESR=1
    -D NODE_ID_DEFAULT=\"NS-UP-245123-N002\"
    -D SCHEME_ID_DEFAULT=\"SCH-UP-245123\"
    -D LGD_GP_CODE_DEFAULT=\"245123\"

; ------------------------------------------------------------------------------
; Environment: Node N3 - Tail-End Household Pressure Node
; ------------------------------------------------------------------------------
[env:esp32_n3_pressure]
extends = common
build_flags = 
    ${common.build_flags}
    -D NODE_TYPE_PRESSURE=1
    -D NODE_ID_DEFAULT=\"NS-UP-245123-N003\"
    -D SCHEME_ID_DEFAULT=\"SCH-UP-245123\"
    -D LGD_GP_CODE_DEFAULT=\"245123\"

; ------------------------------------------------------------------------------
; Environment: Node N4 - Water Quality Monitoring Node
; ------------------------------------------------------------------------------
[env:esp32_n4_quality]
extends = common
build_flags = 
    ${common.build_flags}
    -D NODE_TYPE_QUALITY=1
    -D NODE_ID_DEFAULT=\"NS-UP-245123-N004\"
    -D SCHEME_ID_DEFAULT=\"SCH-UP-245123\"
    -D LGD_GP_CODE_DEFAULT=\"245123\"
